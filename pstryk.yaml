openapi: 3.0.3
info:
  title: Pstryk Backend API
  version: 1.0.0
  description: |-
    Repository-local contract for the active Pstryk integrations API.

    This project uses only the non-deprecated unified metrics endpoint:
    `/integrations/meter-data/unified-metrics/`.

    Canonical metric selectors are:
    - `meter_values`
    - `cost`
    - `carbon`
    - `pricing`
paths:
  /integrations/meter-data/unified-metrics/:
    get:
      operationId: meter_data_unified_metrics_retrieve
      description: |-
        Retrieve one or more energy metrics from the unified integrations endpoint.

        Available metrics:
        - `meter_values` — energy import/export and balance
        - `cost` — energy cost aggregates
        - `carbon` — carbon footprint
        - `pricing` — Pstryk pricing data

        All time values are UTC. If `for_tz` is provided, aggregation follows that
        timezone while timestamps are still returned in UTC. The `for_tz` parameter
        must not be combined with `resolution=hour`.
      tags:
        - meter-data
      security:
        - TokenAuthentication: []
      parameters:
        - in: query
          name: metrics
          required: true
          schema:
            type: string
          description: Comma-separated list of metric selectors.
          examples:
            pricing:
              summary: Pricing only
              value: pricing
            pricing_and_cost:
              summary: Pricing and cost
              value: pricing,cost
            all_metrics:
              summary: All supported metrics
              value: meter_values,cost,carbon,pricing
        - in: query
          name: resolution
          required: true
          schema:
            type: string
            enum:
              - day
              - hour
              - month
          description: Aggregation resolution.
        - in: query
          name: window_start
          required: true
          schema:
            type: string
            format: date-time
          description: Inclusive start of the requested time window in UTC.
        - in: query
          name: window_end
          schema:
            type: string
            format: date-time
          description: Exclusive end of the requested time window in UTC.
        - in: query
          name: for_tz
          schema:
            type: string
          description: Timezone used for aggregation, for example `Europe/Warsaw`.
      responses:
        '200':
          description: Successful unified metrics response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedMetricsResponse'
              examples:
                pricing:
                  summary: Hourly pricing response
                  value:
                    frames:
                      - start: '2026-03-30T00:00:00Z'
                        end: '2026-03-30T01:00:00Z'
                        metrics:
                          pricing:
                            tge_price: 0.509
                            dist_price: 0.0947
                            service_price: 0.08
                            base_price: 0.6837
                            vat_component: 0.157251
                            excise_component: 0.005
                            full_price: 0.845951
                            price_net: 0.509
                            price_gross: 0.845951
                            price_prosumer_net: 0.509
                            price_prosumer_gross: 0.62607
                            is_cheap: false
                            is_expensive: false
                    summary:
                      pricing:
                        tge_price_avg: 0.39
                        dist_price_avg: 0.27
                        service_price_avg: 0.08
                        base_price_avg: 0.74
                        vat_component_avg: 0.17
                        excise_component_avg: 0.005
                        full_price_avg: 0.91
                        price_net_avg: 0.39
                        price_gross_avg: 0.91
                        price_prosumer_net_avg: 0.39
                        price_prosumer_gross_avg: 0.48
        '400':
          description: Bad request. Check query parameters.
        '404':
          description: Not found or unauthorized for the authenticated token.
components:
  schemas:
    UnifiedMetricsResponse:
      type: object
      required:
        - frames
        - summary
      properties:
        frames:
          type: array
          items:
            $ref: '#/components/schemas/UnifiedMetricsFrame'
        summary:
          $ref: '#/components/schemas/UnifiedMetricsSummary'
    UnifiedMetricsFrame:
      type: object
      required:
        - start
        - end
        - metrics
      properties:
        start:
          type: string
          format: date-time
          description: Inclusive frame start in UTC.
        end:
          type: string
          format: date-time
          description: Exclusive frame end in UTC.
        is_live:
          type: boolean
          description: Present and true only for the frame that overlaps the current moment.
        metrics:
          $ref: '#/components/schemas/UnifiedMetricsFrameMetrics'
    UnifiedMetricsFrameMetrics:
      type: object
      properties:
        meter_values:
          $ref: '#/components/schemas/MeterValuesMetric'
        cost:
          $ref: '#/components/schemas/CostMetric'
        carbon:
          $ref: '#/components/schemas/CarbonMetric'
        pricing:
          $ref: '#/components/schemas/PricingMetric'
    UnifiedMetricsSummary:
      type: object
      properties:
        meter_values:
          $ref: '#/components/schemas/MeterValuesSummary'
        cost:
          $ref: '#/components/schemas/CostSummary'
        carbon:
          $ref: '#/components/schemas/CarbonSummary'
        pricing:
          $ref: '#/components/schemas/PricingSummary'
    MeterValuesMetric:
      type: object
      properties:
        energy_active_import_register:
          type: number
          format: double
        energy_active_export_register:
          type: number
          format: double
        energy_balance:
          type: number
          format: double
    MeterValuesSummary:
      type: object
      properties:
        energy_active_import_register_total:
          type: number
          format: double
        energy_active_export_register_total:
          type: number
          format: double
        energy_balance_total:
          type: number
          format: double
    CostMetric:
      type: object
      properties:
        energy_active_import_register_cost:
          type: number
          format: double
        distribution_cost:
          type: number
          format: double
        vat:
          type: number
          format: double
        total_cost:
          type: number
          format: double
    CostSummary:
      type: object
      properties:
        energy_active_import_register_cost_total:
          type: number
          format: double
        distribution_cost_total:
          type: number
          format: double
        vat_total:
          type: number
          format: double
        total_cost_total:
          type: number
          format: double
    CarbonMetric:
      type: object
      properties:
        carbon_footprint:
          type: number
          format: double
    CarbonSummary:
      type: object
      properties:
        carbon_footprint_total:
          type: number
          format: double
    PricingMetric:
      type: object
      properties:
        tge_price:
          type: number
          format: double
        dist_price:
          type: number
          format: double
        service_price:
          type: number
          format: double
        base_price:
          type: number
          format: double
        vat_component:
          type: number
          format: double
        excise_component:
          type: number
          format: double
        full_price:
          type: number
          format: double
        price_net:
          type: number
          format: double
        price_gross:
          type: number
          format: double
        price_prosumer_net:
          type: number
          format: double
        price_prosumer_gross:
          type: number
          format: double
        is_cheap:
          type: boolean
        is_expensive:
          type: boolean
    PricingSummary:
      type: object
      properties:
        tge_price_avg:
          type: number
          format: double
        dist_price_avg:
          type: number
          format: double
        service_price_avg:
          type: number
          format: double
        base_price_avg:
          type: number
          format: double
        vat_component_avg:
          type: number
          format: double
        excise_component_avg:
          type: number
          format: double
        full_price_avg:
          type: number
          format: double
        price_net_avg:
          type: number
          format: double
        price_gross_avg:
          type: number
          format: double
        price_prosumer_net_avg:
          type: number
          format: double
        price_prosumer_gross_avg:
          type: number
          format: double
  securitySchemes:
    TokenAuthentication:
      type: apiKey
      in: header
      name: Authorization
