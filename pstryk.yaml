openapi: 3.0.3
info:
  title: Pstryk Backend API
  version: 1.0.0
  description: |-
    Welcome to the Pstryk Backend API documentation. Please review the following migration schedule and key changes.

    ## Deprecation Policy & Timeline

    * **Until March 31, 2026:** Transition period (Dual Run). Both the legacy and the new unified metrics endpoints will operate in parallel.
    * **April 1, 2026:** **Full decommissioning** of legacy endpoints. Please ensure your migration is completed by this date to avoid service interruptions.

    ## Key Changes

    * **Endpoint Consolidation:** The following legacy endpoints have been merged into a single unified metrics endpoint (`/unified-metrics/`):
      * `/energy-usage/` → `?metrics=meter_values`
      * `/energy-cost/` → `?metrics=cost`
      * `/carbon-footprint/` → `?metrics=carbon`
    * **Core Rewrite:** The business logic has been entirely rewritten, providing significantly higher performance and system stability.
    * **New Data Schemas:** Please review the Models section. Input and output structures have been updated to reflect the new architecture.

    ## Migration Guide

    Most changes involve switching from the individual legacy endpoints to the unified metrics endpoint and mapping your data structures to the new response schema. Multiple legacy calls can now be replaced by a single, more efficient request using comma-separated `metrics` parameter (e.g. `?metrics=meter_values,cost,carbon`).
paths:
  /integrations/meter-data/{id}/power-cost/:
    get:
      operationId: meter_data_power_cost_retrieve
      description: |
        ### Retrieve Aggregated Meter Power Cost

        **NOTE:** To return sample data, use `meter_pk` = `0x0`

        This endpoint returns power cost and energy sold information for a given time window and resolution. The total cost for each hour is calculated as the sum of:

        1. Energy costs:
           - TGE (spot) price × power usage
           - Distribution price × power usage

        2. Fixed fees (prorated per hour):
           - Power fee (based on annual usage brackets: 0-500, 500-1200, 1200-2800, 2800+)
           - Transition fee (based on annual usage brackets: 0-500, 500-1200, 1200+)
           - Network fee (3-phase connection)

        3. Additional fees:
           - Excise tax (configurable in Django admin)
           - Profit margin (configurable in Django admin)

        On the other hand, the total energy sold value denotes the product of the total energy sold and the price of energy sold.

        All time values are in UTC.

        - By providing `for_tz` parameter, you can instruct the endpoint to return the time window in the timezone of choice. All times will be returned in UTC regardless of the `for_tz` value.
        - If `window_end` is not provided, the current time is used.
        - Depending on the `resolution`, the `window_start` and/or `window_end` **will** be automatically rounded down/up to the start/end **by** the resolution unit.
        - It is not allowed to provide `for_tz` parameter in combination with `resolution` set to `hour`.
        - Frame `is_live` flag is true for the frame that is currently "live".

        Response includes:
        - Individual cost frames for the requested resolution (hour/day/month)
        - Total cost for the entire time window
      parameters:
      - in: query
        name: for_tz
        schema:
          type: string
        description: Timezone for which the data should be aggregated. If not provided,
          the data will be aggregated in UTC. E.g. Europe/Warsaw
        examples:
          Europe/Warsaw:
            value: Europe/Warsaw
          UTC:
            value: UTC
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: query
        name: resolution
        schema:
          type: string
          enum:
          - day
          - hour
          - month
          - week
        description: Time resolution
        required: true
      - in: query
        name: window_end
        schema:
          type: string
          format: date-time
        description: End of the time window. Accepts time value with timezone information.
          The only timezone accepted is UTC.
        examples:
          InAnHour:
            value: '2026-03-25T16:14:44Z'
            summary: In an hour
          Tomorrow:
            value: '2026-03-26T15:14:44Z'
          NextWeek:
            value: '2026-04-01T15:14:44Z'
            summary: Next week
          NextMonth:
            value: '2026-04-24T15:14:44Z'
            summary: Next month
      - in: query
        name: window_start
        schema:
          type: string
          format: date-time
        description: Start of the time window. Accepts time value with timezone information.
          The only timezone accepted is UTC.
        required: true
        examples:
          AnHourAgo:
            value: '2026-03-25T14:14:44Z'
            summary: An hour ago
          Yesterday:
            value: '2026-03-24T15:14:44Z'
          AWeekAgo:
            value: '2026-03-18T15:14:44Z'
            summary: A week ago
          AMonthAgo:
            value: '2026-02-22T15:14:44Z'
            summary: A month ago
      tags:
      - meter-data
      security:
      - TokenAuthentication: []
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterPowerCostResponse'
          description: ''
        '404':
          description: Not found. Either the user is not authorized to access the
            requested meter, or the meter does not exist.
  /integrations/meter-data/carbon-footprint/:
    get:
      operationId: meter_data_carbon_footprint_retrieve
      description: |
        ### Retrieve Aggregated Carbon Footprint

        This endpoint returns carbon footprint for a given time window and resolution. Carbon footprint is calculated by multiplying the hourly power usage by the CO2 emission factor for the region.
        Other than returning the carbon footprint for each time frame, this endpoint also returns the total carbon footprint for the entire time window.

        All time values are in UTC.

        Carbon footprint values are expressed in gCO2eq.

        - By providing `for_tz` parameter, you can instruct the endpoint to return the time window in the timezone of choice. All times will be returned in UTC regardless of the `for_tz` value.
        - If `window_end` is not provided, the current time is used.
        - Depending on the `resolution`, the `window_start` and/or `window_end` **will** be automatically rounded down/up to the start/end **by** the resolution unit.
        - It is not allowed to provide `for_tz` parameter in combination with `resolution` set to `hour`.
        - Frame `is_live` flag is true for the frame that is currently "live".
      parameters:
      - in: query
        name: for_tz
        schema:
          type: string
        description: Timezone for which the data should be aggregated. If not provided,
          the data will be aggregated in UTC. E.g. Europe/Warsaw
        examples:
          Europe/Warsaw:
            value: Europe/Warsaw
          UTC:
            value: UTC
      - in: query
        name: resolution
        schema:
          type: string
          enum:
          - day
          - hour
          - month
          - week
        description: Time resolution
        required: true
      - in: query
        name: window_end
        schema:
          type: string
          format: date-time
        description: End of the time window. Accepts time value with timezone information.
          The only timezone accepted is UTC.
        examples:
          InAnHour:
            value: '2026-03-25T16:14:44Z'
            summary: In an hour
          Tomorrow:
            value: '2026-03-26T15:14:44Z'
          NextWeek:
            value: '2026-04-01T15:14:44Z'
            summary: Next week
          NextMonth:
            value: '2026-04-24T15:14:44Z'
            summary: Next month
      - in: query
        name: window_start
        schema:
          type: string
          format: date-time
        description: Start of the time window. Accepts time value with timezone information.
          The only timezone accepted is UTC.
        required: true
        examples:
          AnHourAgo:
            value: '2026-03-25T14:14:44Z'
            summary: An hour ago
          Yesterday:
            value: '2026-03-24T15:14:44Z'
          AWeekAgo:
            value: '2026-03-18T15:14:44Z'
            summary: A week ago
          AMonthAgo:
            value: '2026-02-22T15:14:44Z'
            summary: A month ago
      tags:
      - meter-data
      security:
      - TokenAuthentication: []
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterCarbonFootprintResponse'
          description: ''
        '404':
          description: Not found. Either the user is not authorized to access the
            requested meter, or the meter does not exist.
