  /integrations/meter-data/energy-usage/:
    get:
      operationId: meter_data_energy_usage_retrieve
      description: "### Retrieve Aggregated Meter Power Usage\n\n\nThis endpoint returns
        the aggregated power usage for a given time window and resolution. It will
        return the information on the power usage for each frame in the requested
        time window, as well as the total power usage in it.\n\nAll time values are
        in UTC.\n\n- By providing `for_tz` parameter, you can instruct the endpoint
        to return the time window in the timezone of choice. All times will be returned
        in UTC regardless of the `for_tz` value.\n- If `window_end` is not provided,
        the current time is used.\n- Depending on the `resolution`, the `window_start`
        and/or `window_end` **will** be automatically snapped down/up to the start/end
        of the resolution unit.\n- It is not allowed to provide `for_tz` parameter
        in combination with `resolution` set to `hour`.\n- Frame `is_live` flag is
        true for the frame that is currently \"live\".\n\n**🌟 Note**\n\nBoth
        `window_start` and `window_end` are not snapshot timestamps - rather, they
        represent the culmination of each hourly aggregation period, marking the precise
        moments when data collection wraps up.\n\nThus, `window_start`=`2024-01-01T11:00:00Z`
        will be interpreted as \"give me the aggregated power usage for the period
        between 11:00 to 12:00 on January 1st, 2024\".\n\nOn the other hand, `window_end`=`2024-01-01T11:00:00Z`
        will be interpreted as \"give me the aggregated power usage for the period
        from 10:00 to 11:00 on January 1st, 2024\".\n"
      parameters:
      - in: query
        name: for_tz
        schema:
          type: string
        description: Timezone for which the data should be aggregated. If not provided,
          the data will be aggregated in UTC. E.g. Europe/Warsaw
        examples:
          Europe/Warsaw:
            value: Europe/Warsaw
          UTC:
            value: UTC
      - in: query
        name: resolution
        schema:
          type: string
          enum:
          - day
          - hour
          - month
          - week
          - year
        description: Time resolution
        required: true
      - in: query
        name: window_end
        schema:
          type: string
          format: date-time
        description: End of the time window. Accepts time value with timezone information.
          The only timezone accepted is UTC.
        examples:
          InAnHour:
            value: '2026-03-25T16:14:44Z'
            summary: In an hour
          Tomorrow:
            value: '2026-03-26T15:14:44Z'
          NextWeek:
            value: '2026-04-01T15:14:44Z'
            summary: Next week
          NextMonth:
            value: '2026-04-24T15:14:44Z'
            summary: Next month
          NextYear:
            value: '2027-03-25T15:14:44Z'
            summary: Next year
      - in: query
        name: window_start
        schema:
          type: string
          format: date-time
        description: Start of the time window. Accepts time value with timezone information.
          The only timezone accepted is UTC.
        required: true
        examples:
          AnHourAgo:
            value: '2026-03-25T14:14:44Z'
            summary: An hour ago
          Yesterday:
            value: '2026-03-24T15:14:44Z'
          AWeekAgo:
            value: '2026-03-18T15:14:44Z'
            summary: A week ago
          AMonthAgo:
            value: '2026-02-22T15:14:44Z'
            summary: A month ago
          AYearAgo:
            value: '2025-03-25T15:14:44Z'
            summary: A year ago
      tags:
      - meter-data
      security:
      - TokenAuthentication: []
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterPowerAggregatorResponse'
          description: ''
        '404':
          description: Not found. Either the user is not authorized to access the
            requested meter, or the meter does not exist.
  /integrations/meter-data/unified-metrics/:
    get:
      operationId: meter_data_unified_metrics_retrieve
      description: "### Unified Metrics Endpoint (Integration API)\n\nThis endpoint
        provides a unified interface for retrieving multiple energy metrics in a single
        request. It combines the functionality of the deprecated individual endpoints
        into one flexible, efficient API.\n\n**✨ Replaces Deprecated Endpoints**\n\nThis
        endpoint replaces the following deprecated endpoints:\n- `/integrations/meter-data/energy-usage/`
        - use `?metrics=meterValues`\n- `/integrations/meter-data/energy-cost/` -
        use `?metrics=cost`\n- `/integrations/meter-data/carbon-footprint/` - use
        `?metrics=carbon`\n\nYou can also request multiple metrics in a single call:
        `?metrics=meterValues,cost,carbon`\n\n**⚠️ Important: Transition Period Notice**\n\nDuring
        the initial 2-week transition period, this endpoint may produce results that
        differ from the deprecated endpoints due to:\n- **Mock data usage** - Some
        meters may temporarily use simulated data during the transition\n- **Improved
        precision** - Enhanced calculation methods provide more accurate results but
        may differ slightly from legacy calculations\n\nThese differences are expected
        and reflect improvements in data accuracy and system performance.\n\n**📊
        Available Metrics**\n\n- `meterValues` - Energy consumption and production
        data (replaces energy-usage)\n- `cost` - Energy cost breakdown with tariff
        information (replaces energy-cost)\n- `carbon` - Carbon footprint (CO2 equivalent
        emissions) (replaces carbon-footprint)\n- `pricing` - TGE pricing data (also
        available via separate pricing endpoints)\n\n**⏰ Time Windows and Resolution**\n\nAll
        time values are in UTC.\n\n- By providing `for_tz` parameter, you can instruct
        the endpoint to return the time window in the timezone of choice. All times
        will be returned in UTC regardless of the `for_tz` value.\n- If `window_end`
        is not provided, the current time is used.\n- Depending on the `resolution`,
        the `window_start` and/or `window_end` **will** be automatically snapped down/up
        to the start/end of the resolution unit.\n- It is not allowed to provide `for_tz`
        parameter in combination with `resolution` set to `hour`.\n\n**🌟
        Note on Time Interpretation**\n\nBoth `window_start` and `window_end` are
        not snapshot timestamps - rather, they represent the culmination of each aggregation
        period, marking the precise moments when data collection wraps up.\n\nThus,
        `window_start`=`2024-01-01T11:00:00Z` will be interpreted as \"give me data
        for the period between 11:00 to 12:00 on January 1st, 2024\".\n\nOn the other
        hand, `window_end`=`2024-01-01T11:00:00Z` will be interpreted as \"give me
        data for the period from 10:00 to 11:00 on January 1st, 2024\".\n\n**📋
        Response Structure**\n\nThe response contains two main sections:\n\n1. **frames**:
        Array of time-windowed data points, each containing:\n   - `start`: Start
        time of the frame (ISO 8601 format)\n   - `end`: End time of the frame (ISO
        8601 format)\n   - `is_live` (optional): Boolean flag, present and `true`
        only for the frame that contains the current moment (\"now\"). This applies
        to hourly, daily, and monthly frames alike. Omitted for historical frames
        and for queries that don't extend to the present.\n   - `metrics`: Object
        containing requested metrics data for this frame\n\n2. **summary**: Aggregated
        totals across all frames for each requested metric\n\n**💡 Example
        Request**\n\n```\nGET /integrations/meter-data/unified-metrics/?metrics=meterValues,cost&window_start=2024-01-01T00:00:00Z&window_end=2024-01-01T23:59:59Z&resolution=hour\nAuthorization:
        sk-your-token-here\n```\n\n**📦 Example Response**\n\n```json\n{\n
        \  \"frames\": [\n    {\n      \"start\": \"2024-01-01T00:00:00Z\",\n      \"end\":
        \"2024-01-01T01:00:00Z\",\n      \"metrics\": {\n        \"meterValues\":
        {\n          \"energy_active_import_register\": 1.5,\n          \"energy_active_export_register\":
        0.2,\n          \"energy_balance\": 1.3\n        },\n        \"cost\": {
        \n          \"energy_active_import_register_cost\": 0.45,\n          \"distribution_cost\":
        0.15,\n          \"vat\": 0.12,\n          \"total_cost\": 0.72\n        }
        \n      }\n    }\n  ],\n  \"summary\": {\n    \"meterValues\":
        {\n      \"energy_active_import_register_total\": 36.5,\n      \"energy_active_export_register_total\":
        4.8,\n      \"energy_balance_total\": 31.7\n    },\n    \"cost\":
        {\n      \"energy_active_import_register_cost_total\": 10.95,\n      \"distribution_cost_total\": 3.60,\n      \"vat_total\": 2.88,\n
        \      \"total_cost_total\": 17.43\n    }\n  }\n}\n```\n"
      parameters:
      - in: query
        name: for_tz
        schema:
          type: string
        description: Timezone for which the data should be aggregated. If not provided,
          the data will be aggregated in UTC. E.g. Europe/Warsaw
        examples:
          Europe/Warsaw:
            value: Europe/Warsaw
          UTC:
            value: UTC
      - in: query
        name: metrics
        schema:
          type: string
        description: 'Comma-separated list of metrics to retrieve. Available: meter_values,
          cost, carbon, pricing'
        required: true
        examples:
          SingleMetric:
            value: meter_values
            summary: Single metric
          MultipleMetrics:
            value: meter_values,cost
            summary: Multiple metrics
          AllMetrics:
            value: meter_values,cost,carbon,pricing
            summary: All metrics
      - in: query
        name: resolution
        schema:
          type: string
          enum:
          - day
          - hour
          - month
        description: Time resolution
        required: true
      - in: query
        name: window_end
        schema:
          type: string
          format: date-time
        description: End of the time window. Accepts time value with timezone information.
          The only timezone accepted is UTC.
        examples:
          InAnHour:
            value: '2026-03-25T16:14:44Z'
            summary: In an hour
          Tomorrow:
            value: '2026-03-26T15:14:44Z'
          NextMonth:
            value: '2026-04-24T15:14:44Z'
            summary: Next month
      - in: query
        name: window_start
        schema:
          type: string
          format: date-time
        description: Start of the time window. Accepts time value with timezone information.
          The only timezone accepted is UTC.
        required: true
        examples:
          AnHourAgo:
            value: '2026-03-25T14:14:44Z'
            summary: An hour ago
          Yesterday:
            value: '2026-03-24T15:14:44Z'
          AMonthAgo:
            value: '2026-02-22T15:14:44Z'
            summary: A month ago
      tags:
      - meter-data
      security:
      - TokenAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedMetricsResponse'
          description: ''
        '400':
          description: Bad request. Check your parameters.
        '404':
          description: Not found. Either the user is not authorized to access the
            requested meter, or the meter does not exist.
  /integrations/pricing/:
    get:
      operationId: pricing_retrieve
      description: |
        ### List Pricing

        Returns the pricing for meter related authentication token, for each hour in the given time window and an average price for that time window.

        Returned prices are in PLN/kWh.

        The resolution can be selected from 'hour', 'day', 'month', or 'year'.

        All time values are in UTC.

        - By providing `for_tz` parameter, you can instruct the endpoint to return the time window in the timezone of choice. All times will be returned in UTC regardless of the `for_tz` value.
        - It is not allowed to provide `for_tz` parameter in combination with `resolution` set to `hour`.
        - If `window_end` is not provided, it will default to the end of "tomorrow", that is today + 1 day @ 23:59:59.
        - If `window_end` is before `window_start`, an error will be returned.
        - If `window_end` is more than 31 days after `window_start` for hourly resolution, an error will be returned.
        - Depending on the `resolution`, the `window_start` and/or `window_end` **will** be automatically rounded down/up to the start/end **by** the resolution unit.

        Response format varies based on resolution:

        For hourly resolution:
        ```json
        {
            "price_net_avg": number,
            "price_gross_avg": number,
            "frames": [{
                "start": string,            // UTC timestamp
                "end": string,              // UTC timestamp
                "price_net": number,        // Net price for the hour
                "price_gross": number,      // Gross price for the hour
                "is_cheap": boolean,
                "is_expensive": boolean
            }]
        }
        ```

        For daily/monthly/yearly resolution:
        ```json
        {
            "price_net_avg": number,
            "price_gross_avg": number,
            "frames": [{
                "start": string,            // UTC timestamp
                "end": string,              // UTC timestamp
                "price_net_avg": number,    // Average net price for the period
                "price_gross_avg": number,  // Average gross price for the period
                "is_cheap": boolean,
                "is_expensive": boolean
            }]
        }
        ```

        The "gross" price includes:
        - Net price from TGE
        - Profit margin
        - Excise tax
        - Distribution costs

        The `is_live` flag is true for the frame that is currently live.
      parameters:
      - in: query
        name: for_tz
        schema:
          type: string
        description: Timezone for which the data should be aggregated. If not provided,
          the data will be aggregated in UTC. E.g. Europe/Warsaw
        examples:
          Europe/Warsaw:
            value: Europe/Warsaw
          UTC:
            value: UTC
      - in: query
        name: resolution
        schema:
          type: string
          enum:
          - day
          - hour
          - month
          - year
        description: Time resolution
        required: true
      - in: query
        name: window_end
        schema:
          type: string
          format: date-time
        description: End of the time window. Accepts time value with timezone information.
